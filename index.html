<!-- starting with professor guy's example code -->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link href="styles.css" rel="stylesheet">
        <!-- Links to different fonts we will be using -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cagliostro&family=Knewave&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">    </head>
    <body>
        <div id="content">
            <!-- The section that has the video playing -->
            <div id="video-section">
                <div>
                    <video id="video" width="240" height="180" autoplay></video>
                </div>
                <h2>Take to the skies!</h2>
                <ul>
                    <p><img src="assets/leanLeft.png" width="35px"> <span>to strafe left</span></p>
                    <p><img src="assets/leanRight.png" width="35px"> <span>to strafe right</span></p>
                    <p><img src="assets/armsUp.png" width="30px"> <span>to fly upward</span></p>
                    <p><img src="assets/armsDown.png" width="30px"> <span>to dive downward</span></p>
                </ul>
                <div id="debug-area">
                    <h3>15 (left wrist) and 16 (right wrist), x and y values only</h3>
                    <ul>
                        <li id="left-wrist">POSE 1 to strafe left</li>
                        <li id="right wrist">POSE 2 to strafe left</li>
                        <li>
                            Find map
                            <a
                                href="https://developers.google.com/edge/mediapipe/solutions/vision/pose_landmarker#pose_landmarker_model"
                                target="_blank"
                                >here</a
                            >.
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Display the game -->
            <div id="game-section">
                <iframe src="game.html" width="1200px" height="800px"></iframe>
            </div>

            <!-- Display the different modes-->
            <div id="modes-section">
                <h2>You are currently flying!</h2>
                <p><button id="fly-button">Flying</button></p>
                <p><button id="swim-button">Swimming</button></p>
            </div>
        </div>

        <h1>Flying Game</h1>

        <!-- There will be the sound of wind to enhance the feeling of flying.
        The mp3 file's called "Wind Lake SFX" by SoundReality on pixabay.com -->
        <audio id="wind-sound" autoplay loop>
            <source src="audio/wind.mp3">
        </audio>

        <audio id="water-sound" autoplay loop>
            <source src="audio/water.mp3">
        </audio>

        <!-- the script for the video, + other site features -->
        <script type="module" src="script.js"></script>
    </body>
</html>
