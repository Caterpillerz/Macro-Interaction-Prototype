<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link href="styles.css" rel="stylesheet">
        <!-- Links to different fonts we will be using -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Knewave&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="content">
            <!-- The section that has the video playing -->
            <div id="video-section">
                <div>
                    <video id="video" width="240" height="180" autoplay></video>
                </div>
                <h2>Sample pose markers (one person only)</h2>
                <h3>15 (left wrist) and 16 (right wrist), x and y values only</h3>
                <p id="left-wrist"></p>
                <p id="right-wrist"></p>
                <p>
                    Find map
                    <a
                        href="https://developers.google.com/edge/mediapipe/solutions/vision/pose_landmarker#pose_landmarker_model"
                        target="_blank"
                        >here</a
                    >.
                </p>
            </div>

            <!-- Display the game -->
            <div id="game-section">
                <iframe src="game.html" width="1200px" height="800px"></iframe>
            </div>
        </div>
        <h1>Flying Game</h1>

        <!-- the script for the video -->
        <script type="module" src="script.js"></script>
    </body>
</html>
